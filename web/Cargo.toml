# Its own workspace: it only builds for the browser, against the wasmer submodule.
[workspace]

[package]
name = "clai-web"
version = "0.0.0"
description = "A WASIX v2 machine in the page that runs clai, with its HTTP carried by the page's fetch"
publish = false
edition = "2024"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
async-trait = "0.1"
js-sys = "0.3"
wasixv2 = { path = "../components/wasmer/lib/wasixv2/api", default-features = false, features = ["js", "web", "wasix1"] }
wasixv2-abi = { path = "../components/wasmer/lib/wasixv2/abi" }
wasixv2-vnet = { path = "../components/wasmer/lib/wasixv2/vnet" }
wasixv2-vfs = { path = "../components/wasmer/lib/wasixv2/vfs" }
wasixv2-vfs-package = { path = "../components/wasmer/lib/wasixv2/vfs-package" }
wasmer = { path = "../components/wasmer/lib/api", default-features = false, features = ["js-default"] }
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "AbortController",
    "AbortSignal",
    "Headers",
    "ReadableStream",
    "ReadableStreamDefaultReader",
    "Request",
    "RequestCache",
    "RequestCredentials",
    "RequestInit",
    "RequestMode",
    "RequestRedirect",
    "Response",
] }
webc = { version = "=12.0.1", default-features = false, features = ["v3"] }
