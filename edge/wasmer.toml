# The page as a static site on Wasmer Edge: wasmer/static-web-server serves `public` with the
# headers in settings/config.toml. `make dist` puts this directory and the built page in dist/.
[dependencies]
"wasmer/static-web-server" = "^1"

[fs]
"/public" = "public"
"/settings" = "settings"

[[command]]
name = "script"
module = "wasmer/static-web-server:webserver"
runner = "https://webc.org/runner/wasi"

[command.annotations.wasi]
main-args = ["-w", "/settings/config.toml"]
